<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Hermes</title>
  <style>
    :root {
      /* Soft green palette */
      --bg: #f0fdf4;
      --bg-gradient: linear-gradient(135deg, #ecfdf5 0%, #dcfce7 50%, #bbf7d0 100%);
      --card: #ffffff;
      --card-border: #bbf7d0;
      --primary: #22c55e;
      --primary-hover: #15803d;
      --primary-light: #86efac;
      --primary-soft: #f0fdf4;
      --text: #14532d;
      --text-muted: #64748b;
      --border: #bbf7d0;
      --border-focus: #22c55e;
      --danger: #ef4444;
      --danger-soft: #fef2f2;
      --radius: 14px;
      --shadow: 0 12px 40px rgba(34, 197, 94, 0.12);
      --input-bg: #f0fdf4;
      --input-border: #bbf7d0;
      --status-bg: #ecfdf5;
      --status-border: #a7f3d0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      background-image: var(--bg-gradient);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      margin: 0;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 36px 32px 28px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    /* Soft green accent line above card */
    .card::before {
      content: "";
      position: absolute;
      top: -1px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 4px;
      background: linear-gradient(90deg, #22c55e, #86efac, #22c55e);
      border-radius: 2px;
    }

    .card-header { text-align: center; margin-bottom: 24px; }

    .avatar {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: linear-gradient(135deg, #22c55e, #34d399);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 14px;
      box-shadow: 0 4px 12px rgba(34, 197, 94, 0.35);
    }

    .card h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; color: var(--text); }

    .card p { color: var(--text-muted); font-size: 14px; }

    .field { margin-bottom: 18px; }

    .field label {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 500;
    }

    .input-wrap { position: relative; display: flex; align-items: center; }

    .input-wrap .icon {
      position: absolute;
      left: 12px;
      color: var(--text-muted);
      pointer-events: none;
      display: flex;
      font-size: 17px;
      line-height: 1;
    }

    .input-wrap input {
      width: 100%;
      padding: 13px 16px 13px 42px;
      background: var(--input-bg);
      border: 2px solid var(--input-border);
      border-radius: 10px;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    .input-wrap input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.15);
    }

    .input-wrap input::placeholder { color: #94a3b8; }

    .error {
      color: var(--danger);
      font-size: 13px;
      min-height: 0;
      margin-top: 4px;
      font-weight: 500;
    }

    .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 24px; }

    .btn {
      padding: 14px;
      background: linear-gradient(135deg, #22c55e, #15803d);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 14px rgba(34, 197, 94, 0.3);
    }

    .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(34, 197, 94, 0.4); }

    .btn:active { transform: translateY(1px); box-shadow: 0 2px 8px rgba(34, 197, 94, 0.25); }

    .btn-block { width: 100%; }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .options { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; font-size: 14px; }

    .options a { color: var(--primary); text-decoration: none; font-weight: 500; }

    .options a:hover { text-decoration: underline; color: #15803d; }

    .status {
      margin-top: 16px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 14px;
      display: none;
    }

    .status.success {
      display: block;
      background: #ecfdf5;
      color: #15803d;
      border: 1px solid #a7f3d0;
      border-left: 4px solid #22c55e;
    }

    .status.error {
      display: block;
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
      border-left: 4px solid #ef4444;
    }

    .footer-note { text-align: center; margin-top: 18px; font-size: 13px; color: var(--text-muted); }

    .footer-note a { color: var(--primary); font-weight: 500; text-decoration: none; }
    .footer-note a:hover { color: #15803d; text-decoration: underline; }

    /* Responsive */
    @media (max-width: 480px) {
      .card { padding: 24px 20px 20px; border-radius: 12px; }
      .avatar { width: 50px; height: 50px; font-size: 20px; }
      .card h1 { font-size: 19px; }
      .btn { padding: 12px; font-size: 14px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <div class="avatar">✦</div>
      <h1>Login ke aplikasi</h1>
      <p>Masuk untuk melanjutkan ke dashboard.</p>
    </div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email atau username</label>
        <div class="input-wrap">
          <span class="icon">@</span>
          <input
            id="email"
            name="email"
            type="text"
            placeholder="masukkan email atau username"
            autocomplete="username"
            required
          />
        </div>
      </div>

      <div class="field">
        <label for="password">Kata sandi</label>
        <div class="input-wrap">
          <span class="icon">●</span>
          <input
            id="password"
            name="password"
            type="password"
            placeholder="masukkan kata sandi"
            autocomplete="current-password"
            required
          />
        </div>
      </div>

      <div class="error" id="errorBox"></div>

      <div class="actions">
        <button class="btn btn-block" type="submit">Masuk</button>
      </div>

      <div class="options">
        <label>
          <input type="checkbox" /> Ingat saya
        </label>
        <a href="#">Lupa kata sandi?</a>
      </div>
    </form>

    <div class="status" id="statusBox"></div>

    <div class="footer-note">
      Belum punya akun? <a href="#">Daftar</a>
    </div>
  </div>

  <script>
    (function () {
      var form = document.getElementById("loginForm");
      var email = document.getElementById("email");
      var password = document.getElementById("password");
      var errorBox = document.getElementById("errorBox");
      var statusBox = document.getElementById("statusBox");

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        errorBox.className = "error";
        errorBox.textContent = "";

        var value = email.value.trim();
        if (!value) {
          showError("Email atau username wajib diisi.");
          email.focus();
          return;
        }

        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) {
          showError("Format email tidak valid.");
          email.focus();
          return;
        }

        if (password.value.length < 4) {
          showError("Kata sandi minimal 4 karakter.");
          password.focus();
          return;
        }

        // Placeholder for a real backend call.
        // On success, forward to the app's dashboard.
        statusBox.className = "status success";
        statusBox.textContent = "Memproses login…";
        statusBox.style.display = "block";
        form.querySelector("button[type=submit]").disabled = true;

        setTimeout(function () {
          statusBox.textContent = "Login berhasil. Mengalihkan…";
          // window.location.href = "/dashboard";
        }, 800);
      });

      function showError(msg) {
        errorBox.className = "error";
        errorBox.textContent = msg;
      }
    })();
  </script>
</body>
</html>
